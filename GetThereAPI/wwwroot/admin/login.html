<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · GetThereAPI admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth">
<main class="auth-card">
  <div class="auth-head">
    <div class="rail-mark"><span class="icon icon-logo"></span></div>
    <div class="rail-name">
      <b>GetThereAPI</b>
      <span>AppDB · private</span>
    </div>
  </div>

  <div>
    <h1 style="font-size:19px">Admin console</h1>
    <p class="muted" style="margin:6px 0 0;font-size:12.5px">Users, wallets, ticketing adapters and audit.</p>
  </div>

  <div class="alert hidden" id="error"></div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input class="input" type="email" id="email" name="email" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div style="position:relative">
        <input class="input" type="password" id="password" name="password"
               autocomplete="current-password" required style="padding-right:38px">
        <button type="button" id="reveal" title="Show password"
                style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;
                       padding:4px;cursor:pointer;color:var(--text-4);line-height:0">
          <span class="icon icon-eye" style="width:18px;height:18px"></span>
        </button>
      </div>
    </div>

    <button type="submit" class="btn is-primary is-block" id="submit" style="height:40px">Sign in</button>
  </form>

  <p class="dim" style="margin:0;font-size:11px">
    Tokens are held in <span class="mono">sessionStorage</span> and cleared when the tab closes.
  </p>
</main>

<script src="login.page.js"></script>
</body>
</html>
