<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit log · GetThereAPI admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell"></div>

<script src="admin.js"></script>
<script>
'use strict';

var PAGE_SIZE = 50;
var COLS = '150px minmax(0,200px) 160px minmax(0,1fr) 96px';
var state = { page: 1, expanded: {} };
var page = null;

if (Admin.mount({
  active: 'audit',
  title: 'Audit log',
  meta: 'append-only · AuditLogs',
  actions: '<button type="button" class="btn" id="refresh">Refresh</button>'
})) {
  document.getElementById('refresh').addEventListener('click', function () { load(); });
  document.getElementById('content').innerHTML =
    '<div class="card is-grow"><div id="list"><div class="loading">Loading audit entries</div></div></div>';
  load();
}

async function load() {
  var host = document.getElementById('list');
  host.innerHTML = '<div class="loading">Loading audit entries</div>';
  try {
    page = await Admin.api('/admin/audit?page=' + state.page + '&pageSize=' + PAGE_SIZE);
    render();
  } catch (e) {
    host.innerHTML = '<div class="alert" style="margin:18px">' + Admin.esc(e.message) + '</div>';
  }
}

function render() {
  var host = document.getElementById('list');
  var rows = page.data || [];

  if (!rows.length) {
    host.innerHTML = '<div class="empty">No audit entries recorded.</div>';
    return;
  }

  host.innerHTML =
    '<div class="table-scroll"><div class="table" style="--cols:' + COLS + '">' +
      '<div class="thead"><div>When</div><div>Actor</div><div>Action</div><div>Entity</div><div>Changes</div></div>' +
      rows.map(entryRow).join('') +
    '</div></div>' +
    '<div class="card-foot">' +
      '<span class="mono">' + Admin.num(page.total) + ' entries · page ' + page.page + ' of ' + page.totalPages + '</span>' +
      '<span class="pager">' +
        '<button type="button" class="btn" id="prev"' + (page.hasPreviousPage ? '' : ' disabled') + '>Prev</button>' +
        '<button type="button" class="btn is-accent" id="next"' + (page.hasNextPage ? '' : ' disabled') + '>Next</button>' +
      '</span>' +
    '</div>';

  document.getElementById('prev').addEventListener('click', function () { state.page = page.page - 1; load(); });
  document.getElementById('next').addEventListener('click', function () { state.page = page.page + 1; load(); });

  document.querySelectorAll('[data-entry]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.dataset.entry;
      state.expanded[id] = !state.expanded[id];
      render();
    });
  });
}

function entryRow(e) {
  var hasDiff = e.oldValues || e.newValues;
  var open = state.expanded[e.id];

  return '<div class="trow">' +
      '<div class="sub">' + Admin.dateTime(e.createdAt) + '</div>' +
      '<div>' + (e.userEmail ? Admin.esc(e.userEmail) : '<span class="dim">system</span>') + '</div>' +
      '<div><span class="badge is-accent">' + Admin.esc(e.action) + '</span></div>' +
      '<div class="sub">' + Admin.esc(e.entityType) +
        (e.entityId ? ' <span class="faint">#' + Admin.esc(e.entityId) + '</span>' : '') + '</div>' +
      '<div>' + (hasDiff
        ? '<button type="button" class="btn is-sm" data-entry="' + e.id + '">' + (open ? 'Hide' : 'View') + '</button>'
        : '<span class="dim">—</span>') + '</div>' +
    '</div>' +
    (open && hasDiff
      ? '<div class="trow" style="--cols:1fr;background:var(--surface)">' +
          '<div><div class="grid-2">' +
            '<pre class="code"><span class="del">− old</span>\n' + Admin.esc(pretty(e.oldValues)) + '</pre>' +
            '<pre class="code"><span class="add">+ new</span>\n' + Admin.esc(pretty(e.newValues)) + '</pre>' +
          '</div></div>' +
        '</div>'
      : '');
}

function pretty(json) {
  if (!json) return '—';
  try {
    return JSON.stringify(JSON.parse(json), null, 2);
  } catch (e) {
    return json;
  }
}
</script>
</body>
</html>
