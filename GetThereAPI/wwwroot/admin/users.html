<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Users · GetThereAPI admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell"></div>

<script src="admin.js"></script>
<script>
'use strict';

var PAGE_SIZE = 20;
var COLS = 'minmax(0,1fr) minmax(0,220px) 120px 150px 132px';
var state = { page: 1, query: '' };

if (Admin.mount({
  active: 'users',
  title: 'Users',
  meta: 'identity · GetThereDB',
  actions: '<button type="button" class="btn" id="refresh">Refresh</button>'
})) {
  document.getElementById('refresh').addEventListener('click', function () { load(); });
  document.getElementById('content').innerHTML =
    '<div class="card is-grow">' +
      '<div class="card-head">' +
        '<div class="card-title">Registered users</div>' +
        '<div class="spacer"></div>' +
        '<div class="searchbox"><input id="filter" type="search" placeholder="Filter this page by email or name"></div>' +
      '</div>' +
      '<div id="list"><div class="loading">Loading users</div></div>' +
    '</div>';

  document.getElementById('filter').addEventListener('input', function (e) {
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  load();
}

var page = null;

async function load() {
  var host = document.getElementById('list');
  host.innerHTML = '<div class="loading">Loading users</div>';
  try {
    page = await Admin.api('/admin/users?page=' + state.page + '&pageSize=' + PAGE_SIZE);
    render();
  } catch (e) {
    host.innerHTML = '<div class="alert" style="margin:18px">' + Admin.esc(e.message) + '</div>';
  }
}

function render() {
  if (!page) return;
  var host = document.getElementById('list');
  var rows = (page.data || []).filter(function (u) {
    if (!state.query) return true;
    return (u.email || '').toLowerCase().indexOf(state.query) >= 0 ||
      (u.fullName || '').toLowerCase().indexOf(state.query) >= 0;
  });

  if (!rows.length) {
    host.innerHTML = '<div class="empty">' +
      (state.query ? 'No user on this page matches “' + Admin.esc(state.query) + '”.' : 'No users yet.') +
      '</div>';
    return;
  }

  host.innerHTML =
    '<div class="table-scroll"><div class="table" style="--cols:' + COLS + '">' +
      '<div class="thead"><div>Email</div><div>Name</div><div>Created</div><div>Last login</div><div>User id</div></div>' +
      rows.map(function (u) {
        return '<div class="trow">' +
          '<div>' + Admin.esc(u.email) + '</div>' +
          '<div>' + (u.fullName ? Admin.esc(u.fullName) : '<span class="dim">—</span>') + '</div>' +
          '<div class="sub">' + Admin.date(u.createdAt) + '</div>' +
          '<div class="sub">' + (u.lastLogin ? Admin.dateTime(u.lastLogin) : '<span class="dim">never</span>') + '</div>' +
          '<div class="sub" title="' + Admin.esc(u.id) + '">' + Admin.esc(u.id) + '</div>' +
        '</div>';
      }).join('') +
    '</div></div>' +
    '<div class="card-foot">' +
      '<span class="mono">' + Admin.num(page.total) + ' users · page ' + page.page + ' of ' + page.totalPages + '</span>' +
      '<span class="pager">' +
        '<button type="button" class="btn" id="prev"' + (page.hasPreviousPage ? '' : ' disabled') + '>Prev</button>' +
        '<button type="button" class="btn is-accent" id="next"' + (page.hasNextPage ? '' : ' disabled') + '>Next</button>' +
      '</span>' +
    '</div>';

  document.getElementById('prev').addEventListener('click', function () { state.page = page.page - 1; load(); });
  document.getElementById('next').addEventListener('click', function () { state.page = page.page + 1; load(); });
}
</script>
</body>
</html>
