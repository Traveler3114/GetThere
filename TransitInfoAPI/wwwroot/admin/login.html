<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · TransitInfoAPI admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth">
<main class="auth-card">
  <div class="auth-head">
    <div class="rail-mark">T</div>
    <div class="rail-name">
      <b>TransitInfoAPI</b>
      <span>TransitDB · standalone</span>
    </div>
  </div>

  <div>
    <h1 style="font-size:19px">Map platform admin</h1>
    <p class="muted" style="margin:6px 0 0;font-size:12.5px">
      Operators, feeds, canonical stations, reconciliation and realtime.
    </p>
  </div>

  <div class="alert hidden" id="error"></div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="username">Email</label>
      <input class="input" type="email" id="username" name="username" autocomplete="username" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div style="position:relative">
        <input class="input" type="password" id="password" name="password"
               autocomplete="current-password" required style="padding-right:38px">
        <button type="button" id="reveal" title="Show password"
                style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;
                       padding:4px;cursor:pointer;color:var(--text-4);line-height:0">
          <span class="icon icon-eye" style="width:18px;height:18px"></span>
        </button>
      </div>
    </div>

    <button type="submit" class="btn is-primary is-block" id="submit" style="height:40px">Sign in</button>
  </form>
</main>

<script src="login.page.js"></script>
</body>
</html>
