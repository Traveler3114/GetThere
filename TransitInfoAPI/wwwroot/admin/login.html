<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · TransitInfoAPI admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth">
<main class="auth-card">
  <div class="auth-head">
    <div class="rail-mark">T</div>
    <div class="rail-name">
      <b>TransitInfoAPI</b>
      <span>TransitDB · standalone</span>
    </div>
  </div>

  <div>
    <h1 style="font-size:19px">Map platform admin</h1>
    <p class="muted" style="margin:6px 0 0;font-size:12.5px">
      Operators, feeds, canonical stations, reconciliation and realtime.
    </p>
  </div>

  <div class="alert hidden" id="error"></div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="username">Email</label>
      <input class="input" type="email" id="username" name="username" autocomplete="username" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div style="position:relative">
        <input class="input" type="password" id="password" name="password"
               autocomplete="current-password" required style="padding-right:38px">
        <button type="button" id="reveal" title="Show password"
                style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;
                       padding:4px;cursor:pointer;color:var(--text-4);line-height:0">
          <span class="icon icon-eye" style="width:18px;height:18px"></span>
        </button>
      </div>
    </div>

    <button type="submit" class="btn is-primary is-block" id="submit" style="height:40px">Sign in</button>
  </form>
</main>

<script>
'use strict';

var errorEl = document.getElementById('error');
var submitEl = document.getElementById('submit');
var passwordEl = document.getElementById('password');
var revealEl = document.getElementById('reveal');

revealEl.addEventListener('click', function () {
  var show = passwordEl.type === 'password';
  passwordEl.type = show ? 'text' : 'password';
  revealEl.title = show ? 'Hide password' : 'Show password';
  revealEl.firstElementChild.className = 'icon ' + (show ? 'icon-eye-off' : 'icon-eye');
  revealEl.firstElementChild.style.width = '18px';
  revealEl.firstElementChild.style.height = '18px';
});

document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  errorEl.classList.add('hidden');
  submitEl.disabled = true;
  submitEl.textContent = 'Signing in…';

  try {
    var resp = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('username').value,
        password: passwordEl.value
      })
    });

    if (!resp.ok) {
      fail(resp.status === 401 || resp.status === 400 ? 'Invalid credentials.' : 'Sign-in failed (' + resp.status + ').');
      return;
    }

    var data = await resp.json();
    sessionStorage.setItem('auth_token', data.accessToken);
    window.location.href = redirectTarget();
  } catch (ex) {
    fail('Network error — is the API running?');
  }
});

/** Only same-origin /admin/ paths are honoured, so a stale value cannot redirect off-site. */
function redirectTarget() {
  var stored = sessionStorage.getItem('redirect_after_login');
  sessionStorage.removeItem('redirect_after_login');
  if (!stored) return '/admin/';
  try {
    var url = new URL(stored, window.location.origin);
    if (url.origin === window.location.origin && url.pathname.indexOf('/admin/') === 0 &&
        !url.pathname.endsWith('/login.html')) {
      return url.pathname + url.search + url.hash;
    }
  } catch (e) { /* fall through to the default */ }
  return '/admin/';
}

function fail(message) {
  errorEl.textContent = message;
  errorEl.classList.remove('hidden');
  submitEl.disabled = false;
  submitEl.textContent = 'Sign in';
}
</script>
</body>
</html>
