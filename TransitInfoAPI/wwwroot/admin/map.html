<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Map</title>
<link rel="stylesheet" href="/vendor/maplibre-gl/maplibre-gl.css">
<script src="/vendor/maplibre-gl/maplibre-gl.js"></script>
<script src="/route-colors.js"></script>
<script src="/admin/admin-auth.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; }
#map { height: 100%; width: 100%; }
#home-link {
  position: fixed; top: 12px; left: 12px; z-index: 1500;
  background: rgba(255,255,255,0.95); color: #333; text-decoration: none;
  padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
#home-link:hover { color: #000; }
#sidebar {
  position: fixed; top: 0; right: -400px; width: 400px; height: 100%;
  background: #fff; box-shadow: -2px 0 12px rgba(0,0,0,0.15);
  transition: right 0.3s ease; z-index: 1000; overflow-y: auto; padding: 20px;
}
#sidebar.open { right: 0; }
#sidebar h2 { margin-bottom: 8px; font-size: 1.25rem; }
#sidebar .close-btn {
  float: right; cursor: pointer; font-size: 1.5rem; border: none;
  background: none; color: #666; line-height: 1;
}
#sidebar .close-btn:hover { color: #000; }
#sidebar .info-row { margin: 6px 0; font-size: 0.9rem; }
#sidebar .info-row strong { display: inline-block; width: 100px; color: #555; }
#sidebar .departures { margin-top: 12px; }
#sidebar .departures h3 { font-size: 1rem; margin-bottom: 6px; }
#sidebar .departure-item {
  padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 0.85rem;
}
.route-type-badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  color: #fff; font-size: 0.75rem; font-weight: 600;
}
.admin-action {
  display: inline-block; padding: 8px 16px; border-radius: 6px;
  text-decoration: none; font-size: 0.85rem; font-weight: 600; color: #fff;
}
.admin-action.edit-shape { background: #1f78b4; }
.admin-action.reconcile { background: #7b2d8e; }
.loading { color: #999; font-style: italic; }
#mapError { position:fixed; top:10px; left:50%; transform:translateX(-50%); background:#dc3545; color:#fff; padding:8px 16px; border-radius:6px; font-size:0.85rem; z-index:2000; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
#mapError.d-none { display:none; }
</style>
</head>
<body>
<div id="map"></div>
<a id="home-link" href="/admin/index.html">&larr; Admin console</a>
<div id="mapError" class="d-none"></div>
<div id="sidebar">
  <button class="close-btn" id="sidebarClose">&times;</button>
  <div id="sidebar-content"><p class="loading">Click a stop or route to view details and edit</p></div>
</div>

<script src="map.page.js"></script>
</body>
</html>
