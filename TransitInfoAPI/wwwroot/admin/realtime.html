<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Realtime - Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
<script src="/admin/admin-auth.js"></script>
</head>
<body class="bs">
<div id="shell"></div>
<div id="page">
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="d-flex align-items-center gap-3">
      <span id="liveIndicator" class="small"><span class="live-dot"></span> Live</span>
    </div>
    <div>
      <button class="btn btn-outline-secondary btn-sm" id="pauseBtn" onclick="togglePause()"><i class="bi bi-pause-fill"></i> Pause</button>
      <button class="btn btn-outline-primary btn-sm" onclick="loadVehicles()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
    </div>
  </div>

  <div class="row mb-3 g-2">
    <div class="col-auto">
      <input type="text" id="filterOperator" class="form-control form-control-sm" placeholder="Filter by feed, route, trip or vehicle ID..." oninput="filterVehicles()">
    </div>
    <div class="col-auto">
      <select id="refreshInterval" class="form-select form-select-sm" onchange="updateInterval()">
        <option value="5">5s</option>
        <option value="15" selected>15s</option>
        <option value="30">30s</option>
        <option value="60">60s</option>
      </select>
    </div>
  </div>

  <div id="loading" class="text-center py-4 text-muted"><i class="bi bi-hourglass-split"></i> Loading...</div>
  <div id="error" class="alert alert-danger d-none"></div>
  <div id="content" class="d-none"></div>
  <div id="statusBar" class="small text-muted mt-2 d-none"></div>
</div>
</div>

<script src="/admin/admin-shell.js"></script>
<script>
  Shell.mountLegacy({ active: 'realtime', crumb: 'Monitor', title: 'Realtime Vehicles' });
</script>
<script src="realtime.page.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
