<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alerts - Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
<script src="/admin/admin-auth.js"></script>
</head>
<body class="bs">
<div id="shell"></div>
<div id="page">
<div class="container">
  <div class="d-flex justify-content-end align-items-center mb-3">
    <button class="btn btn-outline-primary btn-sm" onclick="loadAlerts()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
  </div>

  <div class="row mb-3 g-2">
    <div class="col-auto">
      <input type="text" id="filterStop" class="form-control form-control-sm" placeholder="Stop Onestop ID..." oninput="scheduleFilter()">
    </div>
    <div class="col-auto">
      <input type="text" id="filterRoute" class="form-control form-control-sm" placeholder="Route Onestop ID..." oninput="scheduleFilter()">
    </div>
    <div class="col-auto">
      <select id="filterKind" class="form-select form-select-sm" onchange="scheduleFilter()">
        <option value="">All kinds</option>
        <option value="Transit">Transit</option>
        <option value="Road">Road</option>
      </select>
    </div>
  </div>

  <div id="loading" class="text-center py-4 text-muted"><i class="bi bi-hourglass-split"></i> Loading...</div>
  <div id="error" class="alert alert-danger d-none"></div>
  <div id="content" class="d-none"></div>
</div>
</div>

<script src="/admin/admin-shell.js"></script>
<script>
  Shell.mountLegacy({ active: 'alerts', crumb: 'Monitor', title: 'Realtime Alerts' });
</script>
<script src="alerts.page.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
