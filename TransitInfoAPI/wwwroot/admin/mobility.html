<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobility Stations - Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
<script src="/admin/admin-auth.js"></script>
</head>
<body class="bs">
<div id="shell"></div>
<div id="page">
<div class="container">
  <div class="d-flex justify-content-end align-items-center mb-3">
    <div>
      <div class="btn-group btn-group-sm" role="group">
        <input type="radio" class="btn-check" name="viewToggle" id="viewTable" checked onchange="renderMobilityPage()">
        <label class="btn btn-outline-secondary" for="viewTable"><i class="bi bi-table"></i></label>
        <input type="radio" class="btn-check" name="viewToggle" id="viewCards" onchange="renderMobilityPage()">
        <label class="btn btn-outline-secondary" for="viewCards"><i class="bi bi-grid"></i></label>
      </div>
      <button class="btn btn-outline-primary btn-sm ms-2" onclick="loadPage(1)"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
      <select class="form-select form-select-sm d-inline-block ms-2" style="width:auto" onchange="perPage=parseInt(this.value);loadPage(1)">
        <option value="25">25 per page</option>
        <option value="50" selected>50 per page</option>
        <option value="100">100 per page</option>
        <option value="200">200 per page</option>
      </select>
    </div>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-auto">
      <label class="form-label small">Country</label>
      <select id="filterCountry" class="form-select form-select-sm" onchange="loadPage(1)">
        <option value="">All countries</option>
      </select>
    </div>
  </div>

  <div id="loading" class="text-center py-4 text-muted"><i class="bi bi-hourglass-split"></i> Loading...</div>
  <div id="error" class="alert alert-danger d-none"></div>
  <div id="content" class="d-none"></div>
  <div id="pagination" class="d-none"></div>
  <div id="statusBar" class="small text-muted mt-1 d-none"></div>
</div>
</div>

<script src="/admin/admin-shell.js"></script>
<script>
  Shell.mountLegacy({ active: 'mobility', crumb: 'Network', title: 'Mobility Stations' });
</script>
<script src="mobility.page.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
