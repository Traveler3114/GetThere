<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Custom sources - Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
<script src="/admin/admin-auth.js"></script>
</head>
<body class="bs">
<div id="shell"></div>
<div id="page">
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <p class="text-muted small mb-0">
      Operators that publish an API, a web page or a document instead of a GTFS archive.
    </p>
    <div class="d-flex gap-2">
      <button class="btn btn-success btn-sm" onclick="showAddModal()"><i class="bi bi-plus-lg"></i> Add source</button>
      <button class="btn btn-outline-primary btn-sm" onclick="loadSources()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
    </div>
  </div>

  <div id="loading" class="text-center py-4 text-muted"><i class="bi bi-hourglass-split"></i> Loading...</div>
  <div id="error" class="alert alert-danger d-none"></div>
  <div id="content" class="d-none"></div>
</div>
</div>

<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add custom source</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="addError" class="alert alert-danger d-none"></div>
        <div class="mb-3">
          <label class="form-label small">Operator</label>
          <select class="form-select form-select-sm" id="addOperator"></select>
        </div>
        <div class="mb-3">
          <label class="form-label small">Name</label>
          <input class="form-control form-control-sm" id="addName" placeholder="e.g. Autotrolej REST API">
        </div>
        <div class="mb-3">
          <label class="form-label small">Kind</label>
          <select class="form-select form-select-sm" id="addKind">
            <option value="Http">HTTP API (JSON / XML / CSV)</option>
            <option value="Html">HTML page</option>
            <option value="Pdf">PDF timetable</option>
            <option value="Upload">Uploaded file</option>
          </select>
        </div>
        <div class="row g-2 mb-3">
          <div class="col">
            <label class="form-label small">Service window start</label>
            <input type="date" class="form-control form-control-sm" id="addWindowStart">
          </div>
          <div class="col">
            <label class="form-label small">Service window end</label>
            <input type="date" class="form-control form-control-sm" id="addWindowEnd">
          </div>
        </div>
        <p class="text-muted small mb-0">
          The window is only used to invent a calendar for a source that publishes departures without
          one. Leave both blank and no calendar is synthesized.
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-success btn-sm" onclick="createSource()">Create</button>
      </div>
    </div>
  </div>
</div>

<script src="/admin/admin-shell.js"></script>
<script>
  Shell.mountLegacy({ active: 'custom-sources', crumb: 'Network', title: 'Custom sources' });
</script>
<script src="custom-sources.page.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
