name: Build Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

  # Lets this run against any branch on demand.
  #
  # Without it the only way to compile a feature branch is to open a pull request, because the two
  # triggers above match `main`/`develop` and nothing else. So work sat on a branch unbuilt until
  # someone decided it was ready enough to propose — which is exactly backwards, since the reason to
  # build it is to find out whether it is ready. It also means a branch pushed for review, or one a
  # tool pushed without opening a PR, gets no signal at all.
  workflow_dispatch:

# Read-only by default; nothing here writes to the repository.
permissions:
  contents: read

# A new push to the same ref cancels the previous run rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # The database-backed fixtures (AuthFixture, MoneyPathFixture) exercise refresh-token rotation
    # and the wallet debit against a real SQL Server, because neither behaviour survives the
    # in-memory provider. Without this container their constructors throw on the runner and take the
    # whole job red, which is why no run of this workflow had ever been green.
    #
    # The password is a throwaway for an ephemeral container on the job's private network. It is not
    # a secret and must not be reused anywhere else.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Ephemeral_Pw123!"
        ports:
          - 1433:1433

    env:
      TESTS_SQL_CONNECTION: "Server=localhost,1433;User Id=sa;Password=Ci_Ephemeral_Pw123!;TrustServerCertificate=True;Encrypt=False"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Restore/build/lint are scoped per project rather than run over GetThere.slnx, because the
      # solution includes the MAUI project and its workload is not installed on this runner.
      - name: Restore GetThereShared
        run: dotnet restore GetThereShared/GetThereShared.csproj

      - name: Restore SharedAuth
        run: dotnet restore SharedAuth/SharedAuth.csproj

      - name: Restore GetThereAPI
        run: dotnet restore GetThereAPI/GetThereAPI.csproj

      - name: Restore TransitInfoAPI
        run: dotnet restore TransitInfoAPI/TransitInfoAPI.csproj

      - name: Restore tests
        run: dotnet restore tests/GetThere.Tests/GetThere.Tests.csproj

      - name: Build GetThereShared
        run: dotnet build GetThereShared/GetThereShared.csproj --no-restore -warnaserror

      - name: Build SharedAuth
        run: dotnet build SharedAuth/SharedAuth.csproj --no-restore -warnaserror

      - name: Build GetThereAPI
        run: dotnet build GetThereAPI/GetThereAPI.csproj --no-restore -warnaserror

      - name: Build TransitInfoAPI
        run: dotnet build TransitInfoAPI/TransitInfoAPI.csproj --no-restore -warnaserror

      # The container reports "started" well before SQL Server accepts logins, so the first fixture
      # would race it. sqlcmd lives at a different path across image generations; try both.
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            for tool in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do
              if docker exec "${{ job.services.sqlserver.id }}" "$tool" \
                   -S localhost -U sa -P "Ci_Ephemeral_Pw123!" -C -Q "SELECT 1" >/dev/null 2>&1; then
                echo "SQL Server accepted a connection after ${i} attempt(s)."
                exit 0
              fi
            done
            sleep 2
          done
          echo "::error::SQL Server did not become ready within 120s"
          docker logs "${{ job.services.sqlserver.id }}" || true
          exit 1

      - name: Test
        run: dotnet test tests/GetThere.Tests/GetThere.Tests.csproj --no-restore --verbosity normal

      - name: Lint GetThereShared
        run: dotnet format GetThereShared/GetThereShared.csproj --verify-no-changes --no-restore

      - name: Lint SharedAuth
        run: dotnet format SharedAuth/SharedAuth.csproj --verify-no-changes --no-restore

      - name: Lint GetThereAPI
        run: dotnet format GetThereAPI/GetThereAPI.csproj --verify-no-changes --no-restore

      - name: Lint TransitInfoAPI
        run: dotnet format TransitInfoAPI/TransitInfoAPI.csproj --verify-no-changes --no-restore

      - name: Lint GetThere.Tests
        run: dotnet format tests/GetThere.Tests/GetThere.Tests.csproj --verify-no-changes --no-restore

      # Until this step existed the workflow touched no JavaScript at all — no lint, no syntax
      # check, no tests — so the 7,252 lines of console and map script across the two wwwroot trees
      # were the only code here that could ship broken without any signal. A missing brace in
      # public.js is a blank map for every anonymous visitor and a green build.
      #
      # `node --check` parses without executing, so it needs no dependencies, no browser and no
      # network. It catches the class of failure that has no other guard; it is not a linter and is
      # not pretending to be one. All 32 files pass today.
      - name: Syntax-check wwwroot scripts
        run: |
          shopt -s globstar nullglob
          failed=0
          for f in TransitInfoAPI/wwwroot/**/*.js GetThereAPI/wwwroot/**/*.js; do
            if ! node --check "$f"; then
              echo "::error file=$f::JavaScript syntax error"
              failed=1
            fi
          done
          exit $failed

  # Fails the build on a known-vulnerable package. NU1903 (high severity) was previously worked
  # around with <NoWarn> so that -warnaserror would pass; this job makes that hard to repeat quietly.
  vulnerability-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore GetThereShared/GetThereShared.csproj
          dotnet restore SharedAuth/SharedAuth.csproj
          dotnet restore GetThereAPI/GetThereAPI.csproj
          dotnet restore TransitInfoAPI/TransitInfoAPI.csproj

      - name: Check for vulnerable packages
        run: |
          for project in GetThereShared SharedAuth GetThereAPI TransitInfoAPI; do
            echo "== $project"
            dotnet list "$project/$project.csproj" package --vulnerable --include-transitive \
              | tee "/tmp/$project-vulnerable.txt"
            if grep -q "has the following vulnerable packages" "/tmp/$project-vulnerable.txt"; then
              echo "::error::$project depends on a package with a known vulnerability"
              exit 1
            fi
          done

      - name: Check for deprecated packages
        continue-on-error: true
        run: |
          for project in GetThereShared SharedAuth GetThereAPI TransitInfoAPI; do
            dotnet list "$project/$project.csproj" package --deprecated --include-transitive
          done

  # Blocking as of 2026-07-27: the 76 CS0618 warnings (obsolete DisplayAlert/DisplayActionSheet)
  # that made this job permanently red were cleared and net10.0-android builds warning-free.
  #
  # Only the Android head is built. net10.0-windows needs a windows runner with the maui workload,
  # which roughly doubles this job's wall time, and net10.0-ios needs a Mac runner — so a defect in
  # a platform-specific file under Platforms/Windows or Platforms/iOS reaches main unbuilt. There is
  # also no `dotnet format` step for this project, unlike the four above.
  maui:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The full workload, not maui-android.
      #
      # GetThere.csproj multi-targets: on a non-Linux host its TargetFrameworks include net10.0-ios
      # and net10.0-maccatalyst, and on Windows net10.0-windows too. `dotnet restore` resolves every
      # one of them, so with only maui-android installed the restore fails before anything is built:
      #   error NETSDK1147: To build this project, the following workloads must be installed: ios
      # Installing the rest satisfies the imports. It does not build those heads — the build step
      # below is still Android-only, and iOS/Windows remain uncovered by CI.
      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore GetThere
        run: dotnet restore GetThere/GetThere.csproj

      - name: Build GetThere (Android)
        run: dotnet build GetThere/GetThere.csproj --no-restore -f net10.0-android -warnaserror

      # The other five projects have had this since the workflow was written; the MAUI project was
      # the one exception, so formatting drift could only ever land here. Runs after the build
      # because dotnet format needs the project to restore, and a compile error is the more useful
      # failure to see first.
      #
      # NON-BLOCKING for now, deliberately. Turning it on found years of accumulated drift, which is
      # what it was added to find. Two of the three kinds are fixed (a UTF-8 BOM on seven files, and
      # ten files that declare a file-scoped namespace and then indent the body anyway). What is left
      # needs the tool itself rather than hand edits:
      #
      #   - blank lines between import groups (dotnet_separate_import_directive_groups) across
      #     ~8 files in Services/, ViewModels/ and Helpers/
      #   - multi-line expression reflow in Components/AnimatedBackground.xaml.cs
      #
      # One `dotnet format GetThere/GetThere.csproj` on a machine with the MAUI workload fixes all of
      # it in one commit. Do that, then delete this continue-on-error so the step blocks like the
      # other five — leaving it non-blocking indefinitely just recreates the gap it was added to
      # close.
      - name: Lint GetThere
        continue-on-error: true
        run: dotnet format GetThere/GetThere.csproj --verify-no-changes --no-restore
