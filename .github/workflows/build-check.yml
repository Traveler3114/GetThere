name: Build Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Read-only by default; nothing here writes to the repository.
permissions:
  contents: read

# A new push to the same ref cancels the previous run rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Restore/build/lint are scoped per project rather than run over GetThere.slnx, because the
      # solution includes the MAUI project and its workload is not installed on this runner.
      - name: Restore GetThereShared
        run: dotnet restore GetThereShared/GetThereShared.csproj

      - name: Restore GetThereAPI
        run: dotnet restore GetThereAPI/GetThereAPI.csproj

      - name: Restore TransitInfoAPI
        run: dotnet restore TransitInfoAPI/TransitInfoAPI.csproj

      - name: Restore tests
        run: dotnet restore tests/GetThere.Tests/GetThere.Tests.csproj

      - name: Build GetThereShared
        run: dotnet build GetThereShared/GetThereShared.csproj --no-restore -warnaserror

      - name: Build GetThereAPI
        run: dotnet build GetThereAPI/GetThereAPI.csproj --no-restore -warnaserror

      - name: Build TransitInfoAPI
        run: dotnet build TransitInfoAPI/TransitInfoAPI.csproj --no-restore -warnaserror

      - name: Test
        run: dotnet test tests/GetThere.Tests/GetThere.Tests.csproj --no-restore --verbosity normal

      - name: Lint GetThereShared
        run: dotnet format GetThereShared/GetThereShared.csproj --verify-no-changes --no-restore

      - name: Lint GetThereAPI
        run: dotnet format GetThereAPI/GetThereAPI.csproj --verify-no-changes --no-restore

      - name: Lint TransitInfoAPI
        run: dotnet format TransitInfoAPI/TransitInfoAPI.csproj --verify-no-changes --no-restore

  # Fails the build on a known-vulnerable package. NU1903 (high severity) was previously worked
  # around with <NoWarn> so that -warnaserror would pass; this job makes that hard to repeat quietly.
  vulnerability-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore GetThereShared/GetThereShared.csproj
          dotnet restore GetThereAPI/GetThereAPI.csproj
          dotnet restore TransitInfoAPI/TransitInfoAPI.csproj

      - name: Check for vulnerable packages
        run: |
          for project in GetThereShared GetThereAPI TransitInfoAPI; do
            echo "== $project"
            dotnet list "$project/$project.csproj" package --vulnerable --include-transitive \
              | tee "/tmp/$project-vulnerable.txt"
            if grep -q "has the following vulnerable packages" "/tmp/$project-vulnerable.txt"; then
              echo "::error::$project depends on a package with a known vulnerability"
              exit 1
            fi
          done

      - name: Check for deprecated packages
        continue-on-error: true
        run: |
          for project in GetThereShared GetThereAPI TransitInfoAPI; do
            dotnet list "$project/$project.csproj" package --deprecated --include-transitive
          done

  # Blocking as of 2026-07-27: the 76 CS0618 warnings (obsolete DisplayAlert/DisplayActionSheet)
  # that made this job permanently red were cleared, and both net10.0-android and
  # net10.0-windows now build warning-free.
  maui:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Restore GetThere
        run: dotnet restore GetThere/GetThere.csproj

      - name: Build GetThere (Android)
        run: dotnet build GetThere/GetThere.csproj --no-restore -f net10.0-android -warnaserror
